<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>YouTube Comment Handle Extractor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 20px 14px 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 29px;
      line-height: 1.2;
    }

    .subtitle {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #111;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #111;
      color: #fff;
      min-height: 46px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #e9e9e9;
      color: #111;
    }

    .danger {
      background: #ffe5e5;
      color: #b00020;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 11px;
      background: #f0f0f0;
      color: #111;
      font-size: 14px;
      line-height: 1.4;
    }

    .status.error {
      background: #ffe5e5;
      color: #b00020;
    }

    .status.success {
      background: #e7f7e7;
      color: #126b12;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      background: #f3f3f3;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 14px;
      font-weight: 600;
    }

    .results {
      margin-top: 18px;
    }

    .handle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }

    .handle-name {
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }

    .copy-one {
      flex-shrink: 0;
      min-height: 38px;
      padding: 9px 13px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 35px 10px;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 12px 10px 40px;
      }

      .card {
        padding: 18px 15px;
        border-radius: 15px;
      }

      h1 {
        font-size: 24px;
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .buttons button {
        width: 100%;
      }

      .handle {
        align-items: flex-start;
      }

      .copy-one {
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>YouTube Comment Handle Extractor</h1>

    <div class="subtitle">
      Paste a YouTube video or Shorts URL and extract unique commenter
      handles automatically.
    </div>

    <label for="youtubeUrl">YouTube URL</label>

    <input
      id="youtubeUrl"
      type="url"
      autocomplete="off"
      placeholder="https://www.youtube.com/watch?v=..."
    >

    <div class="buttons">

      <button
        id="extractBtn"
        onclick="extractHandles()">
        Extract Handles
      </button>

      <button
        class="secondary"
        onclick="clearResults()">
        Clear
      </button>

    </div>

    <div id="status" class="status"></div>

    <div id="stats" class="stats hidden">

      <div class="stat">
        Handles: <span id="handleCount">0</span>
      </div>

      <div class="stat">
        Comments: <span id="commentCount">0</span>
      </div>

    </div>

    <div id="controls" class="buttons hidden">

      <button onclick="copyAll()">
        Copy All
      </button>

      <button
        class="secondary"
        onclick="downloadTXT()">
        TXT
      </button>

      <button
        class="secondary"
        onclick="downloadCSV()">
        CSV
      </button>

      <button
        id="loadMoreBtn"
        class="secondary"
        onclick="loadMore()">
        Load More
      </button>

    </div>

    <div id="results" class="results"></div>

  </div>

  <div class="footer">
    YouTube Comment Handle Extractor
  </div>

</div>


<script>

/* ============================================================
   YOUR CLOUDFLARE WORKER
   ============================================================ */

const WORKER_URL =
  "https://lucky-breeze-8bef.zumoblockboy.workers.dev/";


/* ============================================================
   APPLICATION STATE
   ============================================================ */

let handles = new Map();

let nextCursor = null;

let currentYouTubeUrl = null;

let loading = false;

let totalCommentsProcessed = 0;


/* ============================================================
   STATUS MESSAGE
   ============================================================ */

function showStatus(message, type = "normal") {

  const status =
    document.getElementById("status");

  status.style.display = "block";

  status.textContent = message;

  status.className = "status";

  if (type === "error") {
    status.classList.add("error");
  }

  if (type === "success") {
    status.classList.add("success");
  }
}


/* ============================================================
   HIDE STATUS
   ============================================================ */

function hideStatus() {

  const status =
    document.getElementById("status");

  status.style.display = "none";

}


/* ============================================================
   YOUTUBE URL VALIDATION
   ============================================================ */

function isValidYouTubeUrl(value) {

  try {

    const url = new URL(value);

    const allowedHosts = [
      "youtube.com",
      "www.youtube.com",
      "m.youtube.com",
      "youtu.be",
      "www.youtu.be"
    ];

    return allowedHosts.includes(
      url.hostname.toLowerCase()
    );

  } catch {

    return false;

  }

}


/* ============================================================
   EXTRACT HANDLES FROM A COMMENT
   ============================================================ */

function extractPossibleHandles(comment) {

  const found = [];

  if (!comment) {
    return found;
  }


  /*
   Possible author fields returned by APIs.
  */

  const possibleNames = [

    comment.author,

    comment.authorHandle,

    comment.authorUsername,

    comment.handle,

    comment.username,

    comment.authorName

  ];


  for (const value of possibleNames) {

    if (!value) {
      continue;
    }

    const text =
      String(value).trim();


    /*
     Direct @username
    */

    if (
      /^@[A-Za-z0-9._-]+$/.test(text)
    ) {

      found.push(text);

      continue;

    }


    /*
     YouTube channel URL
    */

    const channelMatch =
      text.match(
        /youtube\.com\/@([A-Za-z0-9._-]+)/i
      );

    if (channelMatch) {

      found.push(
        "@" + channelMatch[1]
      );

    }

  }


  /*
   Extract @mentions from comment text.
  */

  if (comment.text) {

    const mentions =
      String(comment.text).match(
        /@[A-Za-z0-9._-]+/g
      );

    if (mentions) {

      found.push(...mentions);

    }

  }


  return found;

}


/* ============================================================
   ADD UNIQUE HANDLE
   ============================================================ */

function addHandle(handle) {

  if (!handle) {
    return;
  }

  handle =
    String(handle).trim();


  if (!handle.startsWith("@")) {

    handle =
      "@" + handle;

  }


  /*
   Basic username validation.
  */

  if (
    !/^@[A-Za-z0-9._-]+$/.test(handle)
  ) {

    return;

  }


  /*
   Case-insensitive uniqueness.
  */

  const key =
    handle.toLowerCase();


  if (!handles.has(key)) {

    handles.set(
      key,
      handle
    );

  }

}


/* ============================================================
   PROCESS API RESPONSE
   ============================================================ */

function processResponse(data) {

  let comments = [];


  /*
   Captapi format:
   data.comments
  */

  if (
    data &&
    data.data &&
    Array.isArray(data.data.comments)
  ) {

    comments =
      data.data.comments;

  }


  /*
   Fallback format:
   comments
  */

  else if (
    data &&
    Array.isArray(data.comments)
  ) {

    comments =
      data.comments;

  }


  /*
   Process every comment.
  */

  for (const comment of comments) {

    const found =
      extractPossibleHandles(comment);

    for (const handle of found) {

      addHandle(handle);

    }

  }


  totalCommentsProcessed +=
    comments.length;


  /*
   Pagination cursor.
  */

  nextCursor =
    data?.data?.nextCursor ||
    data?.nextCursor ||
    null;


  renderResults();


  return comments.length;

}


/* ============================================================
   MAIN EXTRACTION
   ============================================================ */

async function extractHandles() {

  if (loading) {
    return;
  }


  const input =
    document.getElementById("youtubeUrl");


  const youtubeUrl =
    input.value.trim();


  if (!youtubeUrl) {

    showStatus(
      "Please paste a YouTube URL.",
      "error"
    );

    return;

  }


  if (!isValidYouTubeUrl(youtubeUrl)) {

    showStatus(
      "Please enter a valid YouTube video or Shorts URL.",
      "error"
    );

    return;

  }


  /*
   Reset previous results.
  */

  handles.clear();

  nextCursor = null;

  totalCommentsProcessed = 0;

  currentYouTubeUrl =
    youtubeUrl;


  document.getElementById(
    "results"
  ).innerHTML = "";


  document.getElementById(
    "stats"
  ).classList.remove("hidden");


  document.getElementById(
    "controls"
  ).classList.remove("hidden");


  await requestComments();

}


/* ============================================================
   REQUEST COMMENTS FROM WORKER
   ============================================================ */

async function requestComments() {

  loading = true;


  const extractBtn =
    document.getElementById(
      "extractBtn"
    );


  const loadMoreBtn =
    document.getElementById(
      "loadMoreBtn"
    );


  extractBtn.disabled = true;

  loadMoreBtn.disabled = true;


  if (nextCursor) {

    showStatus(
      "Loading more comments..."
    );

  } else {

    showStatus(
      "Fetching YouTube comments..."
    );

  }


  try {

    const params =
      new URLSearchParams();


    params.set(
      "url",
      currentYouTubeUrl
    );


    if (nextCursor) {

      params.set(
        "cursor",
        nextCursor
      );

    }


    const requestUrl =
      WORKER_URL +
      "?" +
      params.toString();


    const response =
      await fetch(requestUrl, {
        method: "GET",
        headers: {
          "Accept":
            "application/json"
        }
      });


    const text =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(text);

    } catch {

      throw new Error(
        "The Worker did not return JSON. Check that your Cloudflare Worker contains the backend code."
      );

    }


    if (!response.ok) {

      const message =
        data?.error ||
        data?.message ||
        `Request failed (${response.status})`;

      throw new Error(message);

    }


    const amount =
      processResponse(data);


    if (amount === 0) {

      if (handles.size === 0) {

        showStatus(
          "No comments were returned for this video."
        );

      } else {

        showStatus(
          "No additional comments were returned.",
          "success"
        );

      }

    } else {

      showStatus(
        `${amount} comments processed. ${handles.size} unique handles found.`,
        "success"
      );

    }


    updateLoadMoreButton();

  } catch (error) {

    console.error(error);

    showStatus(
      "Error: " +
      error.message,
      "error"
    );

  } finally {

    loading = false;

    extractBtn.disabled = false;

    loadMoreBtn.disabled = false;

  }

}


/* ============================================================
   LOAD MORE COMMENTS
   ============================================================ */

async function loadMore() {

  if (loading) {
    return;
  }


  if (!nextCursor) {

    showStatus(
      "There are no more comments to load."
    );

    updateLoadMoreButton();

    return;

  }


  await requestComments();

}


/* ============================================================
   UPDATE LOAD MORE BUTTON
   ============================================================ */

function updateLoadMoreButton() {

  const button =
    document.getElementById(
      "loadMoreBtn"
    );


  if (!nextCursor) {

    button.textContent =
      "No More Comments";

    button.disabled = true;

  } else {

    button.textContent =
      "Load More";

    button.disabled = false;

  }

}


/* ============================================================
   RENDER RESULTS
   ============================================================ */

function renderResults() {

  const results =
    document.getElementById(
      "results"
    );


  const values =
    Array.from(
      handles.values()
    );


  document.getElementById(
    "handleCount"
  ).textContent =
    values.length;


  document.getElementById(
    "commentCount"
  ).textContent =
    totalCommentsProcessed;


  results.innerHTML = "";


  if (values.length === 0) {

    results.innerHTML = `
      <div class="empty">
        No handles found yet.
      </div>
    `;

    return;

  }


  for (const handle of values) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "handle";


    const name =
      document.createElement(
        "span"
      );

    name.className =
      "handle-name";

    name.textContent =
      handle;


    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "secondary copy-one";

    copy.textContent =
      "Copy";


    copy.onclick =
      async function () {

        try {

          await navigator.clipboard.writeText(
            handle
          );

          copy.textContent =
            "Copied!";

          setTimeout(
            () => {
              copy.textContent =
                "Copy";
            },
            1200
          );

        } catch {

          showStatus(
            "Could not copy this handle.",
            "error"
          );

        }

      };


    row.appendChild(name);

    row.appendChild(copy);

    results.appendChild(row);

  }

}


/* ============================================================
   COPY ALL HANDLES
   ============================================================ */

async function copyAll() {

  const values =
    Array.from(
      handles.values()
    );


  if (values.length === 0) {

    showStatus(
      "There are no handles to copy.",
      "error"
    );

    return;

  }


  try {

    await navigator.clipboard.writeText(
      values.join("\n")
    );


    showStatus(
      `${values.length} handles copied to clipboard.`,
      "success"
    );

  } catch {

    showStatus(
      "Copy failed. Your browser may have blocked clipboard access.",
      "error"
    );

  }

}


/* ============================================================
   DOWNLOAD TXT
   ============================================================ */

function downloadTXT() {

  const values =
    Array.from(
      handles.values()
    );


  if (values.length === 0) {

    showStatus(
      "There are no handles to download.",
      "error"
    );

    return;

  }


  const blob =
    new Blob(
      [
        values.join("\n")
      ],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  downloadBlob(
    blob,
    "youtube-handles.txt"
  );

}


/* ============================================================
   DOWNLOAD CSV
   ============================================================ */

function downloadCSV() {

  const values =
    Array.from(
      handles.values()
    );


  if (values.length === 0) {

    showStatus(
      "There are no handles to download.",
      "error"
    );

    return;

  }


  const rows = [
    ["Handle"],
    ...values.map(
      handle => [handle]
    )
  ];


  const csv =
    rows
      .map(
        row =>
          row
            .map(
              value =>
                `"${String(value)
                  .replace(/"/g, '""')}"`
            )
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );


  downloadBlob(
    blob,
    "youtube-handles.csv"
  );

}


/* ============================================================
   DOWNLOAD FILE
   ============================================================ */

function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download = filename;


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => {
      URL.revokeObjectURL(url);
    },
    1000
  );

}


/* ============================================================
   CLEAR EVERYTHING
   ============================================================ */

function clearResults() {

  handles.clear();

  nextCursor = null;

  currentYouTubeUrl = null;

  totalCommentsProcessed = 0;


  document.getElementById(
    "youtubeUrl"
  ).value = "";


  document.getElementById(
    "results"
  ).innerHTML = "";


  document.getElementById(
    "handleCount"
  ).textContent = "0";


  document.getElementById(
    "commentCount"
  ).textContent = "0";


  document.getElementById(
    "controls"
  ).classList.add("hidden");


  document.getElementById(
    "stats"
  ).classList.add("hidden");


  hideStatus();


  updateLoadMoreButton();

}


/* ============================================================
   ENTER KEY SUPPORT
   ============================================================ */

document
  .getElementById("youtubeUrl")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        extractHandles();

      }

    }
  );


/* ============================================================
   INITIAL BUTTON STATE
   ============================================================ */

updateLoadMoreButton();

</script>

</body>
</html>
